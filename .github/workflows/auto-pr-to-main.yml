name: Auto-create PR from Lovable edit branch to main

on:
  push:
    branches:
      - 'edit/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          # If main already contains this branch (the sync workflow merged it),
          # a PR would be empty — skip.
          git fetch origin main
          if git merge-base --is-ancestor "origin/$BRANCH" origin/main 2>/dev/null; then
            echo "main already contains $BRANCH. Skipping PR."
            exit 0
          fi
          # Check if an open PR from this branch already exists
          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists from $BRANCH to main. Skipping."
            exit 0
          fi

          # Create the PR
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Lovable changes from $BRANCH" \
            --body "Automated PR created by Lovable publish workflow."
