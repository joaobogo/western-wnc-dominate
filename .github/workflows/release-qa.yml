name: Release QA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Lint, test, build and route audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTEXT: deploy-preview
      NETLIFY: "true"
      CI: "true"
      INDEXNOW_FORCE: "false"
    steps:
      - name: Checkout final source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies exactly like Netlify
        run: npm install --legacy-peer-deps

      - name: Install Chromium for prerender QA
        run: npx playwright install --with-deps chromium

      - name: Lint release-critical website files
        continue-on-error: true
        run: >
          npx eslint
          src/App.tsx
          src/pages/RoofingLanding.tsx
          src/pages/ConstructionLanding.tsx
          src/pages/CombinedLanding.tsx
          src/components/Hero.tsx
          src/components/gallery/PremiumLightbox.tsx
          src/components/system/PaidLandingGate.tsx
          src/data/services.ts
          src/data/blogs.ts
          src/data/blog-index.generated.ts
          src/data/towns.ts

      - name: Full repository lint debt (informational only)
        continue-on-error: true
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Full production build and prerender
        run: npm run build

      - name: SEO, broken-link and route regression gate
        run: npm run seo:check
