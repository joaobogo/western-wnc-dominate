# Netlify build configuration for highlandernc.com
#
# NOTE: the *production branch* itself can only be set in the Netlify UI
# (Site configuration -> Build & deploy -> Branches and deploy contexts).
# Set "Production branch" to the current Lovable edit branch:
#   edit/edt-2b43a08a-34b6-4329-a9e0-92a47ed4d965
# and enable "Deploy only the production branch" (or add edit/* below).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Build every Lovable edit branch as a branch deploy too, so a new
# edit/** branch never leaves the site stale.
[context.branch-deploy]
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200