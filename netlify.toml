# Netlify build configuration for highlandernc.com
#
# NOTE: the *production branch* itself can only be set in the Netlify UI
# (Site configuration -> Build & deploy -> Branches and deploy contexts).
# Set "Production branch" to the current Lovable edit branch:
#   edit/edt-2b43a08a-34b6-4329-a9e0-92a47ed4d965
# and enable "Deploy only the production branch" (or add edit/* below).

[build]
  command = "npm install --legacy-peer-deps && npx playwright install --with-deps chromium && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Build every Lovable edit branch as a branch deploy too, so a new
# edit/** branch never leaves the site stale.
[context.branch-deploy]
  command = "npm install --legacy-peer-deps && npx playwright install --with-deps chromium && npm run build"

# NOTE: there is no global /* -> /index.html catch-all any more. Every public
# URL ships as a real prerendered HTML file in dist (see scripts/prerender.mjs),
# and unknown URLs fall through to dist/404.html with a real 404 status.
# Scoped SPA rewrites for app-only paths live in public/_redirects, below the
# 301! rules. Keep the two files in sync.
